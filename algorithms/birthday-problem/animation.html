<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日问题 — Birthday Problem</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1a2e; color:#eee; font-family:'Segoe UI',sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .container { max-width:1100px; margin:0 auto; padding:20px; }
  h1 { text-align:center; color:#e94560; margin-bottom:4px; font-size:1.5rem; }
  .subtitle { text-align:center; color:#889; font-size:0.85rem; margin-bottom:18px; }

  .layout { display:flex; gap:16px; flex-wrap:wrap; }
  .panel {
    background:#16213e; border-radius:12px; padding:16px;
    border:1px solid #0f3460;
  }
  .left { flex:1 1 320px; }
  .right { flex:2 1 500px; }

  .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .control-group { display:flex; flex-direction:column; gap:3px; }
  .control-group label { font-size:0.72rem; color:#aab; }
  input[type=range] { width:140px; }
  button {
    background:#e94560; color:#fff; border:none; padding:8px 16px;
    border-radius:6px; cursor:pointer; font-size:0.82rem;
    transition:opacity .2s;
  }
  button:hover { opacity:.85; }
  button.secondary { background:#0f3460; }

  canvas { display:block; width:100%; border-radius:8px; background:#0d1b2a; }

  .stats { display:flex; gap:20px; margin-top:10px; font-size:0.85rem; color:#aab; flex-wrap:wrap; }
  .stats b { color:#fff; font-size:1.05rem; }
  .stat-box { background:#0d1b2a; padding:8px 14px; border-radius:8px; border:1px solid #1a3a5c; }
  .highlight { color:#e94560; }

  .legend { display:flex; gap:14px; margin-top:8px; font-size:0.75rem; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

  .calendar-grid {
    display:grid; grid-template-columns:repeat(7, 1fr); gap:3px;
    margin-top:10px; max-width:280px;
  }
  .cal-cell {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:0.65rem; border-radius:4px; background:#0d1b2a;
    border:1px solid #1a3a5c; color:#667;
  }
  .cal-cell.has-bday { background:#e94560; color:#fff; font-weight:bold; border-color:#e94560; }
  .cal-cell.multi { background:#f9c74f; color:#1a1a2e; border-color:#f9c74f; }

  .month-labels {
    display:grid; grid-template-columns:repeat(7, 1fr); gap:3px;
    max-width:280px; margin-top:4px;
  }
  .month-labels div { font-size:0.6rem; color:#667; text-align:center; }

  h3 { font-size:0.95rem; color:#e94560; margin-bottom:8px; margin-top:4px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎂 生日问题 — Birthday Problem</h1>
  <div class="subtitle">50 人中至少两人生日相同的概率是多少？</div>

  <div class="layout">
    <div class="panel left">
      <h3>📅 生日分布日历</h3>
      <div class="controls">
        <div class="control-group">
          <label>班级人数</label>
          <input id="nSlider" type="range" min="1" max="100" value="50">
          <span id="nVal" style="font-size:0.75rem;color:#e94560;">50</span>
        </div>
        <button id="btnRandom">🎲 随机生成</button>
      </div>
      <canvas id="calendarCanvas" width="320" height="260"></canvas>
      <div class="stats">
        <div class="stat-box">重复对数: <b id="statPairs">0</b></div>
        <div class="stat-box">概率: <b id="statProb" class="highlight">--</b></div>
      </div>
    </div>

    <div class="panel right">
      <h3>📈 概率曲线 & Monte Carlo 模拟</h3>
      <div class="controls">
        <button id="btnSim">▶ 运行 Monte Carlo</button>
        <button id="btnReset" class="secondary">⟲ 重置</button>
        <div class="control-group">
          <label>模拟速度</label>
          <input id="speedSlider" type="range" min="1" max="20" value="5">
        </div>
      </div>
      <canvas id="curveCanvas" width="560" height="220"></canvas>
      <div class="legend">
        <span><i class="dot" style="background:#e94560;"></i>精确概率</span>
        <span><i class="dot" style="background:#4cc9f0;"></i>近似公式</span>
        <span><i class="dot" style="background:#90be6d;"></i>Monte Carlo</span>
        <span><i class="dot" style="background:#f9c74f;"></i>当前人数</span>
      </div>
      <div class="stats">
        <div class="stat-box">模拟次数: <b id="statTrials">0</b></div>
        <div class="stat-box">命中次数: <b id="statHits">0</b></div>
        <div class="stat-box">估计概率: <b id="statEst">--</b></div>
      </div>
    </div>
  </div>
</div>

<script>
// =============================================================================
// 数学函数
// =============================================================================

function exactProb(n, D=365) {
  if (n > D) return 1.0;
  let p = 1.0;
  for (let i=0; i<n; i++) p *= (D - i) / D;
  return 1 - p;
}

function approxProb(n, D=365) {
  return 1 - Math.exp(-n*(n-1)/(2*D));
}

function generateBirthdays(n, D=365) {
  const arr = new Uint16Array(n);
  for (let i=0; i<n; i++) arr[i] = Math.floor(Math.random() * D);
  return arr;
}

function countCollisions(arr) {
  const freq = new Uint16Array(365);
  for (let v of arr) freq[v]++;
  let pairs = 0;
  for (let i=0; i<365; i++) if (freq[i] > 1) pairs += freq[i] * (freq[i]-1) / 2;
  return { pairs, freq };
}

// =============================================================================
// 日历 Canvas
// =============================================================================

const calCanvas = document.getElementById('calendarCanvas');
const calCtx = calCanvas.getContext('2d');
let currentN = 50;
let currentBdays = generateBirthdays(50);

function drawCalendar() {
  const w = calCanvas.width, h = calCanvas.height;
  calCtx.clearRect(0, 0, w, h);

  const cols = 7;
  const rows = 53; // 365/7 ≈ 52.1
  const cellW = (w - 20) / cols;
  const cellH = Math.min(cellW, (h - 30) / rows);
  const padX = 10, padY = 20;

  const { freq } = countCollisions(currentBdays);

  calCtx.font = '10px sans-serif';
  calCtx.fillStyle = '#889';
  calCtx.textAlign = 'center';
  const days = ['日','一','二','三','四','五','六'];
  for (let c=0; c<cols; c++) {
    calCtx.fillText(days[c], padX + c*cellW + cellW/2, 14);
  }

  for (let d=0; d<365; d++) {
    const row = Math.floor(d / cols);
    const col = d % cols;
    const x = padX + col * cellW;
    const y = padY + row * cellH;

    if (freq[d] === 0) {
      calCtx.fillStyle = '#0d1b2a';
      calCtx.strokeStyle = '#1a3a5c';
    } else if (freq[d] === 1) {
      calCtx.fillStyle = '#e94560';
      calCtx.strokeStyle = '#e94560';
    } else {
      calCtx.fillStyle = '#f9c74f';
      calCtx.strokeStyle = '#f9c74f';
    }

    calCtx.beginPath();
    calCtx.roundRect(x, y, cellW-2, cellH-2, 3);
    calCtx.fill();
    calCtx.stroke();

    if (freq[d] > 1) {
      calCtx.fillStyle = '#1a1a2e';
      calCtx.font = 'bold 9px sans-serif';
      calCtx.textBaseline = 'middle';
      calCtx.fillText(freq[d], x + (cellW-2)/2, y + (cellH-2)/2 + 1);
    }
  }

  // Legend
  calCtx.textAlign = 'left';
  calCtx.textBaseline = 'alphabetic';
  let ly = h - 4;
  calCtx.fillStyle = '#e94560'; calCtx.fillRect(10, ly-8, 10, 10);
  calCtx.fillStyle = '#889'; calCtx.fillText('1人', 24, ly);
  calCtx.fillStyle = '#f9c74f'; calCtx.fillRect(60, ly-8, 10, 10);
  calCtx.fillStyle = '#889'; calCtx.fillText('≥2人', 74, ly);
}

function updateCalendar() {
  currentBdays = generateBirthdays(currentN);
  drawCalendar();
  const { pairs } = countCollisions(currentBdays);
  document.getElementById('statPairs').textContent = pairs;
  const p = exactProb(currentN);
  document.getElementById('statProb').textContent = (p*100).toFixed(2) + '%';
}

// =============================================================================
// 概率曲线 Canvas
// =============================================================================

const curveCanvas = document.getElementById('curveCanvas');
const cctx = curveCanvas.getContext('2d');

function drawCurve() {
  const w = curveCanvas.width, h = curveCanvas.height;
  const pad = {l:45, t:15, r:15, b:30};
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;

  cctx.clearRect(0, 0, w, h);

  // Grid
  cctx.strokeStyle = '#1a3a5c'; cctx.lineWidth = 1;
  for (let i=0; i<=5; i++) {
    const y = pad.t + ch * (i/5);
    cctx.beginPath(); cctx.moveTo(pad.l, y); cctx.lineTo(pad.l+cw, y); cctx.stroke();
  }
  for (let i=0; i<=10; i++) {
    const x = pad.l + cw * (i/10);
    cctx.beginPath(); cctx.moveTo(x, pad.t); cctx.lineTo(x, pad.t+ch); cctx.stroke();
  }

  // Exact curve
  cctx.strokeStyle = '#e94560'; cctx.lineWidth = 2;
  cctx.beginPath();
  for (let n=1; n<=100; n++) {
    const x = pad.l + (n/100) * cw;
    const y = pad.t + ch * (1 - exactProb(n));
    if (n===1) cctx.moveTo(x,y); else cctx.lineTo(x,y);
  }
  cctx.stroke();

  // Approx curve
  cctx.strokeStyle = '#4cc9f0'; cctx.lineWidth = 1.5;
  cctx.setLineDash([4,4]);
  cctx.beginPath();
  for (let n=1; n<=100; n++) {
    const x = pad.l + (n/100) * cw;
    const y = pad.t + ch * (1 - approxProb(n));
    if (n===1) cctx.moveTo(x,y); else cctx.lineTo(x,y);
  }
  cctx.stroke();
  cctx.setLineDash([]);

  // Monte Carlo points
  if (simData.length > 0) {
    cctx.fillStyle = '#90be6d';
    for (let d of simData) {
      const x = pad.l + (d.n/100) * cw;
      const y = pad.t + ch * (1 - d.p);
      cctx.beginPath(); cctx.arc(x, y, 2.5, 0, Math.PI*2); cctx.fill();
    }
  }

  // Current n marker
  const cx = pad.l + (currentN/100) * cw;
  const cy = pad.t + ch * (1 - exactProb(currentN));
  cctx.strokeStyle = '#f9c74f'; cctx.lineWidth = 2;
  cctx.beginPath();
  cctx.arc(cx, cy, 5, 0, Math.PI*2);
  cctx.stroke();
  cctx.fillStyle = '#f9c74f';
  cctx.font = '10px sans-serif';
  cctx.textAlign = 'center';
  cctx.fillText(`n=${currentN}`, cx, cy - 10);

  // 50% line
  const y50 = pad.t + ch * 0.5;
  cctx.strokeStyle = '#667'; cctx.setLineDash([2,4]); cctx.lineWidth = 1;
  cctx.beginPath(); cctx.moveTo(pad.l, y50); cctx.lineTo(pad.l+cw, y50); cctx.stroke();
  cctx.setLineDash([]);
  cctx.fillStyle = '#667'; cctx.textAlign = 'right';
  cctx.fillText('50%', pad.l-4, y50+3);

  // Axis labels
  cctx.fillStyle = '#889'; cctx.font = '10px sans-serif';
  cctx.textAlign = 'right';
  for (let i=0; i<=5; i++) {
    const v = (1 - i/5);
    cctx.fillText((v*100).toFixed(0)+'%', pad.l-4, pad.t + ch*(i/5)+3);
  }
  cctx.textAlign = 'center';
  for (let i=0; i<=10; i++) {
    const v = i * 10;
    cctx.fillText(v, pad.l + cw*(i/10), pad.t+ch+14);
  }
  cctx.fillStyle = '#aab';
  cctx.fillText('人数 n', pad.l + cw/2, h - 4);
}

// =============================================================================
// Monte Carlo 模拟
// =============================================================================

let simData = [];
let simRunning = false;
let simTrials = 0, simHits = 0;
let simAnimId = null;

function runSimStep() {
  const speed = parseInt(document.getElementById('speedSlider').value);
  for (let k=0; k<speed; k++) {
    const n = currentN;
    const bdays = generateBirthdays(n);
    const { pairs } = countCollisions(bdays);
    simTrials++;
    if (pairs > 0) simHits++;
  }
  const est = simHits / simTrials;
  simData.push({ n: currentN, p: est });
  if (simData.length > 200) simData.shift();

  document.getElementById('statTrials').textContent = simTrials.toLocaleString();
  document.getElementById('statHits').textContent = simHits.toLocaleString();
  document.getElementById('statEst').textContent = (est*100).toFixed(2) + '%';

  drawCurve();
}

function simLoop() {
  if (!simRunning) return;
  runSimStep();
  simAnimId = requestAnimationFrame(simLoop);
}

// =============================================================================
// 事件绑定
// =============================================================================

document.getElementById('nSlider').oninput = function() {
  currentN = parseInt(this.value);
  document.getElementById('nVal').textContent = currentN;
  updateCalendar();
  drawCurve();
};

document.getElementById('btnRandom').onclick = function() {
  updateCalendar();
};

document.getElementById('btnSim').onclick = function() {
  if (simRunning) {
    simRunning = false;
    this.textContent = '▶ 运行 Monte Carlo';
    cancelAnimationFrame(simAnimId);
  } else {
    simRunning = true;
    this.textContent = '⏸ 暂停';
    simLoop();
  }
};

document.getElementById('btnReset').onclick = function() {
  simRunning = false;
  cancelAnimationFrame(simAnimId);
  simData = [];
  simTrials = 0; simHits = 0;
  document.getElementById('statTrials').textContent = '0';
  document.getElementById('statHits').textContent = '0';
  document.getElementById('statEst').textContent = '--';
  document.getElementById('btnSim').textContent = '▶ 运行 Monte Carlo';
  drawCurve();
};

// Init
updateCalendar();
drawCurve();
</script>
</body>
</html>
