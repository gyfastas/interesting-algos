<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坏芯片检测问题 — Faulty Chip Detection</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1a2e; color:#eee; font-family:'Segoe UI',sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .container { max-width:1100px; margin:0 auto; padding:20px; }
  h1 { text-align:center; color:#e94560; margin-bottom:4px; font-size:1.5rem; }
  .subtitle { text-align:center; color:#889; font-size:0.82rem; margin-bottom:16px; }

  .layout { display:flex; gap:14px; flex-wrap:wrap; }
  .panel {
    background:#16213e; border-radius:12px; padding:14px;
    border:1px solid #0f3460;
  }
  .left { flex:1 1 360px; }
  .right { flex:2 1 500px; }

  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .control-group { display:flex; flex-direction:column; gap:2px; }
  .control-group label { font-size:0.7rem; color:#aab; }
  input[type=range] { width:100px; }
  button {
    background:#e94560; color:#fff; border:none; padding:7px 14px;
    border-radius:6px; cursor:pointer; font-size:0.8rem;
    transition:opacity .2s;
  }
  button:hover { opacity:.85; }
  button.secondary { background:#0f3460; }
  button:disabled { opacity:0.4; cursor:not-allowed; }

  canvas { display:block; width:100%; border-radius:8px; background:#0d1b2a; }

  .stats { display:flex; gap:10px; margin-top:8px; font-size:0.78rem; color:#aab; flex-wrap:wrap; }
  .stats b { color:#fff; }
  .stat-box { background:#0d1b2a; padding:6px 10px; border-radius:6px; border:1px solid #1a3a5c; }

  .legend { display:flex; gap:12px; margin-top:6px; font-size:0.72rem; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

  .info-text { font-size:0.8rem; color:#aab; margin-top:8px; line-height:1.5; }

  .encoding-table {
    width:100%; border-collapse:collapse; font-size:0.75rem; margin-top:8px;
  }
  .encoding-table th, .encoding-table td {
    padding:4px 6px; text-align:center; border:1px solid #1a3a5c;
  }
  .encoding-table th { background:#0f3460; color:#fff; }
  .encoding-table td { background:#0d1b2a; }
  .encoding-table .highlight-row { background:#1a3a5c !important; color:#e94560; font-weight:bold; }

  h3 { font-size:0.9rem; color:#e94560; margin-bottom:6px; }
</style>
</head>
<body>
<div class="container">
  <h1>🔬 坏芯片检测问题</h1>
  <div class="subtitle">等价于 LeetCode 458 Poor Pigs — (T+1)^N >= B</div>

  <div class="layout">
    <div class="panel left">
      <div class="controls">
        <div class="control-group">
          <label>芯片数 B</label>
          <input id="bSlider" type="range" min="2" max="27" value="9">
          <span id="bVal" style="font-size:0.7rem;color:#e94560;">9</span>
        </div>
        <div class="control-group">
          <label>测试轮数 T</label>
          <input id="tSlider" type="range" min="1" max="4" value="2">
          <span id="tVal" style="font-size:0.7rem;color:#e94560;">2</span>
        </div>
        <button id="btnReset">⟲ 重置</button>
      </div>
      <div class="stats">
        <div class="stat-box">理论最小 N: <b id="statMinN" style="color:#e94560;">--</b></div>
        <div class="stat-box">(T+1)^N: <b id="statCapacity">--</b></div>
      </div>
      <div class="controls" style="margin-top:10px;">
        <button id="btnStep">▶ 下一步</button>
        <button id="btnAuto" class="secondary">⏵ 自动</button>
        <button id="btnRandBad" class="secondary">🎲 换坏芯片</button>
      </div>
      <div class="info-text" id="infoText">
        调节 B, T 后点击"下一步"开始模拟。
      </div>
      <div style="max-height:200px; overflow-y:auto; margin-top:8px;">
        <table class="encoding-table" id="encodeTable">
          <thead><tr><th>芯片</th><th>d₀</th><th>d₁</th><th>d₂</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="panel right">
      <canvas id="simCanvas" width="520" height="340"></canvas>
      <div class="legend">
        <span><i class="dot" style="background:#4cc9f0;"></i>完好检查器</span>
        <span><i class="dot" style="background:#f9c74f;"></i>本轮坏掉</span>
        <span><i class="dot" style="background:#e94560;"></i>之前已坏</span>
        <span><i class="dot" style="background:#90be6d;"></i>芯片被测</span>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px;">
    <h3>📊 常用对照表 (最小 N)</h3>
    <canvas id="tableCanvas" width="1060" height="140"></canvas>
  </div>
</div>

<script>
// =============================================================================
// 数学函数
// =============================================================================

function minCheckers(B, T) {
  if(B <= 1) return 0;
  if(T === 0) return B;
  return Math.ceil(Math.log(B) / Math.log(T + 1));
}

function encodeStrategy(B, N, T) {
  const base = T + 1;
  const strategy = [];
  for(let id=0; id<B; id++) {
    const digits = [];
    let x = id;
    for(let i=0; i<N; i++) {
      digits.push(x % base);
      x = Math.floor(x / base);
    }
    strategy.push(digits);
  }
  return strategy;
}

// =============================================================================
// 状态
// =============================================================================

let B = 9, T = 2, N = 2;
let badChip = 4;
let strategy = [];
let currentRound = 0;
let checkerStates = []; // 0=完好, t=第t轮后坏
let autoTimer = null;

// =============================================================================
// 模拟 Canvas
// =============================================================================

const simCanvas = document.getElementById('simCanvas');
const sctx = simCanvas.getContext('2d');

function drawSim() {
  const w = simCanvas.width, h = simCanvas.height;
  sctx.clearRect(0, 0, w, h);

  // Title
  sctx.fillStyle = '#aab'; sctx.font = 'bold 12px sans-serif'; sctx.textAlign = 'left';
  const roundText = currentRound === 0 ? '准备阶段' : `第 ${currentRound} / ${T} 轮`;
  sctx.fillText(`${roundText}  |  坏芯片 = ${badChip}  |  编码 = (${strategy[badChip]?.join(',') || ''})`, 10, 18);

  const base = T + 1;
  const cellW = 36, cellH = 28;
  const startX = 20, startY = 40;

  // Grid header: chip ids
  sctx.fillStyle = '#889'; sctx.font = '10px sans-serif'; sctx.textAlign = 'center';
  for(let chip=0; chip<B; chip++) {
    const cx = startX + 50 + chip * cellW + cellW/2;
    sctx.fillText(chip, cx, startY - 6);
  }

  // Grid rows: rounds
  for(let t=1; t<=T; t++) {
    const cy = startY + (t-1) * cellH;
    sctx.fillStyle = '#889'; sctx.font = '10px sans-serif'; sctx.textAlign = 'right';
    sctx.fillText('第' + t + '轮', startX + 40, cy + cellH/2 + 4);

    for(let chip=0; chip<B; chip++) {
      const cx = startX + 50 + chip * cellW;
      const isTested = strategy[chip] && strategy[chip][0] !== undefined;
      const digit = isTested ? strategy[chip][0] : 0; // show round 1 digit

      // For display, show which checker tests this chip in each round
      let testedBy = -1;
      for(let i=0; i<N; i++) {
        if(strategy[chip] && strategy[chip][i] === t) {
          testedBy = i;
          break;
        }
      }

      const isBadChip = (chip === badChip);
      const isHighlighted = isBadChip && testedBy >= 0;

      sctx.fillStyle = isHighlighted ? '#e94560' : (testedBy >= 0 ? '#1a3a5c' : '#0d1b2a');
      if(testedBy >= 0 && !isHighlighted) sctx.fillStyle = '#1a3a5c';
      sctx.fillRect(cx + 1, cy + 1, cellW - 2, cellH - 2);
      sctx.strokeStyle = '#0f3460'; sctx.lineWidth = 1;
      sctx.strokeRect(cx, cy, cellW, cellH);

      if(testedBy >= 0) {
        sctx.fillStyle = isHighlighted ? '#fff' : '#90be6d';
        sctx.font = 'bold 10px sans-serif'; sctx.textAlign = 'center';
        sctx.fillText('C' + testedBy, cx + cellW/2, cy + cellH/2 + 4);
      }
    }
  }

  // Checker status
  const checkerY = startY + T * cellH + 20;
  sctx.fillStyle = '#aab'; sctx.font = 'bold 11px sans-serif'; sctx.textAlign = 'left';
  sctx.fillText('检查器状态:', startX, checkerY);

  for(let i=0; i<N; i++) {
    const cx = startX + 80 + i * 70;
    const state = checkerStates[i];
    let color, label;
    if(state === 0) {
      color = '#4cc9f0'; label = '完好';
    } else if(state === currentRound && currentRound > 0) {
      color = '#f9c74f'; label = '本轮坏';
    } else {
      color = '#e94560'; label = '第' + state + '轮坏';
    }

    sctx.fillStyle = color;
    sctx.beginPath(); sctx.arc(cx + 15, checkerY + 10, 12, 0, Math.PI*2); sctx.fill();
    sctx.fillStyle = '#1a1a2e'; sctx.font = 'bold 10px sans-serif'; sctx.textAlign = 'center';
    sctx.fillText('C'+i, cx + 15, checkerY + 13);

    sctx.fillStyle = '#889'; sctx.font = '9px sans-serif'; sctx.textAlign = 'center';
    sctx.fillText(label, cx + 15, checkerY + 32);
  }

  // Decode result
  if(currentRound >= T) {
    let decoded = 0;
    for(let i=0; i<N; i++) {
      decoded += checkerStates[i] * Math.pow(base, i);
    }
    const resultY = checkerY + 50;
    sctx.fillStyle = decoded === badChip ? '#90be6d' : '#e94560';
    sctx.font = 'bold 13px sans-serif'; sctx.textAlign = 'left';
    sctx.fillText(`解码: d=[${checkerStates.join(',')}] → ${decoded} (base-${base}) = ${decoded === badChip ? '✓ 正确!' : '✗ 错误!'}`, startX, resultY);
  }
}

function step() {
  if(currentRound >= T) {
    stopAuto();
    return;
  }
  currentRound++;
  const base = T + 1;

  // Determine which checkers break this round
  for(let i=0; i<N; i++) {
    if(checkerStates[i] === 0 && strategy[badChip][i] === currentRound) {
      checkerStates[i] = currentRound;
    }
  }

  drawSim();
  updateInfo();
}

function updateInfo() {
  const el = document.getElementById('infoText');
  if(currentRound === 0) {
    el.textContent = `坏芯片 = ${badChip}，编码 = (${strategy[badChip]?.join(',') || ''})，点击"下一步"开始。`;
  } else if(currentRound < T) {
    el.textContent = `第 ${currentRound} 轮结束。继续点击"下一步"。`;
  } else {
    let decoded = 0;
    const base = T + 1;
    for(let i=0; i<N; i++) decoded += checkerStates[i] * Math.pow(base, i);
    const ok = decoded === badChip;
    el.innerHTML = `<span style="color:${ok ? '#90be6d' : '#e94560'};">${ok ? '✓' : '✗'} 解码结果: ${decoded}，${ok ? '正确!' : '错误!'}</span>`;
  }
}

function reset() {
  B = parseInt(document.getElementById('bSlider').value);
  T = parseInt(document.getElementById('tSlider').value);
  N = minCheckers(B, T);

  strategy = encodeStrategy(B, N, T);
  currentRound = 0;
  checkerStates = new Array(N).fill(0);

  document.getElementById('statMinN').textContent = N;
  document.getElementById('statCapacity').textContent = Math.pow(T+1, N);
  updateInfo();
  drawSim();
  drawTable();
  updateEncodeTable();
}

function updateEncodeTable() {
  const tbody = document.querySelector('#encodeTable tbody');
  const thead = document.querySelector('#encodeTable thead tr');
  tbody.innerHTML = '';
  thead.innerHTML = '<th>芯片</th>';
  for(let i=0; i<N; i++) thead.innerHTML += `<th>d<sub>${i}</sub></th>`;

  for(let chip=0; chip<B; chip++) {
    const tr = document.createElement('tr');
    if(chip === badChip) tr.className = 'highlight-row';
    let html = `<td>${chip}</td>`;
    for(let i=0; i<N; i++) {
      html += `<td>${strategy[chip][i]}</td>`;
    }
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
}

function startAuto() {
  if(autoTimer) return;
  document.getElementById('btnAuto').textContent = '⏸ 暂停';
  autoTimer = setInterval(()=>{
    if(currentRound >= T) stopAuto();
    else step();
  }, 800);
}

function stopAuto() {
  if(autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById('btnAuto').textContent = '⏵ 自动';
}

// =============================================================================
// 对照表 Canvas
// =============================================================================

const tableCanvas = document.getElementById('tableCanvas');
const tctx = tableCanvas.getContext('2d');

function drawTable() {
  const w = tableCanvas.width, h = tableCanvas.height;
  tctx.clearRect(0, 0, w, h);

  const Bvals = [4, 8, 16, 27, 64, 100, 1000];
  const Tvals = [1, 2, 3, 4, 5, 9, 15];
  const cellW = 100, cellH = 28;
  const startX = 70, startY = 35;

  // Header row
  tctx.fillStyle = '#e94560'; tctx.font = 'bold 11px sans-serif'; tctx.textAlign = 'center';
  for(let j=0; j<Tvals.length; j++) {
    tctx.fillText('T=' + Tvals[j], startX + j*cellW + cellW/2, 18);
  }

  // Header col
  tctx.textAlign = 'right';
  for(let i=0; i<Bvals.length; i++) {
    tctx.fillText('B=' + Bvals[i], startX - 8, startY + i*cellH + cellH/2 + 4);
  }

  // Cells
  for(let i=0; i<Bvals.length; i++) {
    for(let j=0; j<Tvals.length; j++) {
      const n = minCheckers(Bvals[i], Tvals[j]);
      const x = startX + j*cellW;
      const y = startY + i*cellH;
      tctx.fillStyle = '#0d1b2a';
      tctx.fillRect(x+1, y+1, cellW-2, cellH-2);
      tctx.strokeStyle = '#1a3a5c'; tctx.lineWidth = 1;
      tctx.strokeRect(x, y, cellW, cellH);
      tctx.fillStyle = '#fff'; tctx.font = 'bold 12px sans-serif'; tctx.textAlign = 'center';
      tctx.fillText(n, x + cellW/2, y + cellH/2 + 4);
    }
  }
}

// =============================================================================
// Events
// =============================================================================

document.getElementById('bSlider').oninput = function() {
  B = parseInt(this.value);
  document.getElementById('bVal').textContent = B;
  reset();
};
document.getElementById('tSlider').oninput = function() {
  T = parseInt(this.value);
  document.getElementById('tVal').textContent = T;
  reset();
};
document.getElementById('btnReset').onclick = reset;
document.getElementById('btnStep').onclick = function() { stopAuto(); step(); };
document.getElementById('btnAuto').onclick = function() {
  if(autoTimer) stopAuto(); else startAuto();
};
document.getElementById('btnRandBad').onclick = function() {
  badChip = Math.floor(Math.random() * B);
  reset();
};

// Init
reset();
</script>
</body>
</html>
