<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坏芯片检测问题 — Faulty Chip Detection</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#1a1a2e; color:#eee; font-family:'Segoe UI',sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .container { max-width:1100px; margin:0 auto; padding:20px; }
  h1 { text-align:center; color:#e94560; margin-bottom:4px; font-size:1.5rem; }
  .subtitle { text-align:center; color:#889; font-size:0.82rem; margin-bottom:16px; }

  .layout { display:flex; gap:14px; flex-wrap:wrap; }
  .panel {
    background:#16213e; border-radius:12px; padding:14px;
    border:1px solid #0f3460;
  }
  .left { flex:1 1 340px; }
  .right { flex:2 1 520px; }

  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .control-group { display:flex; flex-direction:column; gap:2px; }
  .control-group label { font-size:0.7rem; color:#aab; }
  input[type=range] { width:100px; }
  button {
    background:#e94560; color:#fff; border:none; padding:7px 14px;
    border-radius:6px; cursor:pointer; font-size:0.8rem;
    transition:opacity .2s;
  }
  button:hover { opacity:.85; }
  button.secondary { background:#0f3460; }
  button:disabled { opacity:0.4; cursor:not-allowed; }

  canvas { display:block; width:100%; border-radius:8px; background:#0d1b2a; }

  .stats { display:flex; gap:10px; margin-top:8px; font-size:0.78rem; color:#aab; flex-wrap:wrap; }
  .stats b { color:#fff; }
  .stat-box { background:#0d1b2a; padding:6px 10px; border-radius:6px; border:1px solid #1a3a5c; }

  .legend { display:flex; gap:12px; margin-top:6px; font-size:0.72rem; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

  .info-text { font-size:0.8rem; color:#aab; margin-top:8px; line-height:1.5; }
  .info-text code { background:#0d1b2a; padding:1px 5px; border-radius:3px; color:#4cc9f0; font-family:monospace; }

  h3 { font-size:0.9rem; color:#e94560; margin-bottom:6px; }
</style>
</head>
<body>
<div class="container">
  <h1>🔬 坏芯片检测问题</h1>
  <div class="subtitle">B 个芯片，T 次测试，至少需要多少个检查器 N？</div>

  <div class="layout">
    <div class="panel left">
      <div class="controls">
        <div class="control-group">
          <label>芯片数 B</label>
          <input id="bSlider" type="range" min="2" max="24" value="10">
          <span id="bVal" style="font-size:0.7rem;color:#e94560;">10</span>
        </div>
        <div class="control-group">
          <label>测试次数 T</label>
          <input id="tSlider" type="range" min="1" max="5" value="3">
          <span id="tVal" style="font-size:0.7rem;color:#e94560;">3</span>
        </div>
        <div class="control-group">
          <label>检查器 N</label>
          <input id="nSlider" type="range" min="1" max="10" value="4">
          <span id="nVal" style="font-size:0.7rem;color:#e94560;">4</span>
        </div>
        <button id="btnReset">⟲ 重置</button>
      </div>
      <div class="stats">
        <div class="stat-box">P(N,T): <b id="statFalling">--</b></div>
        <div class="stat-box">理论最小 N: <b id="statMinN" style="color:#e94560;">--</b></div>
      </div>
      <div class="controls" style="margin-top:10px;">
        <button id="btnStep">▶ 下一步</button>
        <button id="btnAuto" class="secondary">⏵ 自动</button>
        <button id="btnRandBad" class="secondary">🎲 随机坏芯片</button>
      </div>
      <div class="info-text" id="infoText">
        调节 B, T, N 后点击"下一步"开始模拟。
      </div>
    </div>

    <div class="panel right">
      <canvas id="simCanvas" width="540" height="320"></canvas>
      <div class="legend">
        <span><i class="dot" style="background:#4cc9f0;"></i>候选芯片</span>
        <span><i class="dot" style="background:#e94560;"></i>坏芯片</span>
        <span><i class="dot" style="background:#90be6d;"></i>完好检查器</span>
        <span><i class="dot" style="background:#f9c74f;"></i>坏掉的检查器</span>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px;">
    <h3>📊 常用对照表 (最小 N)</h3>
    <canvas id="tableCanvas" width="1060" height="140"></canvas>
  </div>
</div>

<script>
// =============================================================================
// 数学函数
// =============================================================================

function fallingFactorial(N, T) {
  const effT = Math.min(T, N);
  let p = 1;
  for(let i=0; i<effT; i++) p *= (N - i);
  return p;
}

function minCheckers(B, T) {
  if(B <= 1) return 0;
  let lo=1, hi=Math.max(B, T), ans=hi;
  while(lo <= hi) {
    const mid = (lo+hi)>>1;
    if(fallingFactorial(mid, T) >= B) { ans=mid; hi=mid-1; }
    else lo=mid+1;
  }
  return ans;
}

function encodePaths(B, N, T) {
  const paths = [];
  for(let id=0; id<B; id++) {
    const path = [];
    let rem = id;
    for(let t=0; t<T; t++) {
      const base = N - t;
      path.push(rem % base);
      rem = Math.floor(rem / base);
    }
    paths.push(path);
  }
  return paths;
}

// =============================================================================
// 状态
// =============================================================================

let B = 10, T = 3, N = 4;
let badChip = 7;
let paths = [];
let candidates = [];
let available = [];
let currentRound = 0;
let autoTimer = null;

// =============================================================================
// 模拟 Canvas
// =============================================================================

const simCanvas = document.getElementById('simCanvas');
const sctx = simCanvas.getContext('2d');

function drawSim() {
  const w = simCanvas.width, h = simCanvas.height;
  sctx.clearRect(0, 0, w, h);

  // Title
  sctx.fillStyle = '#aab'; sctx.font = 'bold 12px sans-serif'; sctx.textAlign = 'left';
  sctx.fillText(`第 ${currentRound} / ${T} 轮  |  候选集: ${candidates.length} 个芯片  |  可用检查器: ${available.length} 个`, 10, 18);

  // Draw chips
  const chipR = 14;
  const chipsPerRow = Math.min(B, 12);
  const chipStartY = 40;
  const chipGapX = 38;
  const chipGapY = 38;

  for(let i=0; i<B; i++) {
    const row = Math.floor(i / chipsPerRow);
    const col = i % chipsPerRow;
    const cx = 20 + col * chipGapX + chipR;
    const cy = chipStartY + row * chipGapY + chipR;

    const isCandidate = candidates.includes(i);
    const isBad = (i === badChip);

    sctx.beginPath();
    sctx.arc(cx, cy, chipR, 0, Math.PI*2);
    if(isBad && currentRound > 0) {
      sctx.fillStyle = '#e94560';
    } else if(isCandidate) {
      sctx.fillStyle = '#4cc9f0';
    } else {
      sctx.fillStyle = '#1a3a5c';
    }
    sctx.fill();
    sctx.strokeStyle = isCandidate || (isBad && currentRound>0) ? '#fff' : '#0f3460';
    sctx.lineWidth = 1.5;
    sctx.stroke();

    sctx.fillStyle = '#fff'; sctx.font = '10px sans-serif'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(i, cx, cy);

    // path label
    if(paths[i] && currentRound === 0) {
      sctx.fillStyle = '#889'; sctx.font = '9px monospace';
      sctx.fillText('(' + paths[i].join(',') + ')', cx, cy + chipR + 10);
    }
  }

  // Draw checkers
  const checkerW = 50, checkerH = 70;
  const checkerStartX = 20;
  const checkerY = h - checkerH - 15;

  for(let i=0; i<N; i++) {
    const cx = checkerStartX + i * (checkerW + 10);
    const isAvailable = available.includes(i);
    const isBrokenThisRound = (currentRound > 0 && !isAvailable && currentRound <= T &&
      (() => {
        // Determine if this checker broke in the current-1 round
        const prevAvail = [];
        for(let j=0; j<N; j++) prevAvail.push(j);
        let prevCandidates = Array.from({length:B},(_,k)=>k);
        for(let r=0; r<currentRound-1; r++) {
          const groups = groupByPath(prevCandidates, r, prevAvail);
          const badIdx = paths[badChip][r];
          const actualIdx = prevAvail.indexOf(badIdx);
          prevAvail.splice(actualIdx, 1);
          prevCandidates = groups[actualIdx];
        }
        const lastGroups = groupByPath(prevCandidates, currentRound-1, prevAvail);
        const lastBadIdx = paths[badChip][currentRound-1];
        const actualBadIdx = prevAvail.indexOf(lastBadIdx);
        return prevAvail[actualBadIdx] === i;
      })());

    sctx.fillStyle = isAvailable ? '#90be6d' : (isBrokenThisRound ? '#f9c74f' : '#1a3a5c');
    sctx.strokeStyle = isAvailable ? '#90be6d' : (isBrokenThisRound ? '#f9c74f' : '#0f3460');
    sctx.lineWidth = 2;
    sctx.beginPath();
    sctx.roundRect(cx, checkerY, checkerW, checkerH, 6);
    sctx.fill(); sctx.stroke();

    sctx.fillStyle = isAvailable || isBrokenThisRound ? '#1a1a2e' : '#667';
    sctx.font = 'bold 11px sans-serif'; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('C' + i, cx + checkerW/2, checkerY + checkerH/2);

    // label
    sctx.fillStyle = '#889'; sctx.font = '9px sans-serif';
    sctx.fillText(isAvailable ? '可用' : (isBrokenThisRound ? '已坏' : '已坏'), cx + checkerW/2, checkerY + checkerH + 12);
  }

  // Draw arrows from chips to checkers for current round
  if(currentRound > 0 && currentRound <= T && candidates.length > 1) {
    const m = available.length;
    const groups = groupByPath(candidates, currentRound-1, available);
    for(let gi=0; gi<groups.length; gi++) {
      const checkerIdx = available[gi];
      const cxChecker = checkerStartX + checkerIdx * (checkerW + 10) + checkerW/2;
      const cyChecker = checkerY;
      for(const chip of groups[gi]) {
        const row = Math.floor(chip / chipsPerRow);
        const col = chip % chipsPerRow;
        const cxChip = 20 + col * chipGapX + chipR;
        const cyChip = chipStartY + row * chipGapY + chipR * 2;
        sctx.strokeStyle = 'rgba(255,255,255,0.15)'; sctx.lineWidth = 1;
        sctx.beginPath(); sctx.moveTo(cxChip, cyChip); sctx.lineTo(cxChecker, cyChecker); sctx.stroke();
      }
    }
  }
}

function groupByPath(cand, roundIdx, avail) {
  const groups = [];
  for(let i=0; i<avail.length; i++) groups.push([]);
  for(const chip of cand) {
    const idx = paths[chip][roundIdx];
    const pos = avail.indexOf(idx);
    if(pos >= 0) groups[pos].push(chip);
  }
  return groups;
}

function step() {
  if(currentRound >= T || candidates.length <= 1) {
    stopAuto();
    updateInfo();
    return;
  }

  const m = available.length;
  if(m === 0) {
    stopAuto();
    updateInfo();
    return;
  }

  const groups = groupByPath(candidates, currentRound, available);
  const badCheckerIdx = paths[badChip][currentRound];
  const actualBadPos = available.indexOf(badCheckerIdx);

  available.splice(actualBadPos, 1);
  candidates = groups[actualBadPos];
  currentRound++;
  drawSim();
  updateInfo();
}

function updateInfo() {
  const el = document.getElementById('infoText');
  if(candidates.length === 1) {
    const found = candidates[0] === badChip;
    el.innerHTML = `<span style="color:#90be6d;">✓ 已确定坏芯片为 ${candidates[0]}${found ? '' : ' (错误!)'}</span>`;
  } else if(currentRound >= T || available.length === 0) {
    el.innerHTML = `<span style="color:#e94560;">✗ ${currentRound} 轮后仍有 ${candidates.length} 个候选，无法确定！</span>`;
  } else {
    el.innerHTML = `第 ${currentRound+1} 轮: 将 ${candidates.length} 个候选芯片分配到 ${available.length} 个检查器中...`;
  }
}

function reset() {
  B = parseInt(document.getElementById('bSlider').value);
  T = parseInt(document.getElementById('tSlider').value);
  N = parseInt(document.getElementById('nSlider').value);

  // Ensure N is sufficient for falling factorial >= B
  const minN = minCheckers(B, T);
  if(N < minN) {
    N = minN;
    document.getElementById('nSlider').value = N;
    document.getElementById('nVal').textContent = N;
  }

  paths = encodePaths(B, N, T);
  candidates = Array.from({length:B}, (_,i)=>i);
  available = Array.from({length:N}, (_,i)=>i);
  currentRound = 0;

  document.getElementById('statFalling').textContent = fallingFactorial(N, T);
  document.getElementById('statMinN').textContent = minN;
  document.getElementById('infoText').textContent = `坏芯片 = ${badChip}，点击"下一步"开始模拟。`;

  drawSim();
  drawTable();
}

function startAuto() {
  if(autoTimer) return;
  document.getElementById('btnAuto').textContent = '⏸ 暂停';
  autoTimer = setInterval(()=>{
    if(currentRound >= T || candidates.length <= 1 || available.length === 0) {
      stopAuto();
    } else {
      step();
    }
  }, 600);
}

function stopAuto() {
  if(autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById('btnAuto').textContent = '⏵ 自动';
}

// =============================================================================
// 对照表 Canvas
// =============================================================================

const tableCanvas = document.getElementById('tableCanvas');
const tctx = tableCanvas.getContext('2d');

function drawTable() {
  const w = tableCanvas.width, h = tableCanvas.height;
  tctx.clearRect(0, 0, w, h);

  const Bvals = [2, 4, 6, 10, 12, 24, 50, 100];
  const Tvals = [1, 2, 3, 4, 5];
  const cellW = 80, cellH = 28;
  const startX = 60, startY = 35;

  // Header row
  tctx.fillStyle = '#e94560'; tctx.font = 'bold 11px sans-serif'; tctx.textAlign = 'center';
  for(let j=0; j<Tvals.length; j++) {
    tctx.fillText('T=' + Tvals[j], startX + j*cellW + cellW/2, 18);
  }

  // Header col
  tctx.textAlign = 'right';
  for(let i=0; i<Bvals.length; i++) {
    tctx.fillText('B=' + Bvals[i], startX - 8, startY + i*cellH + cellH/2 + 4);
  }

  // Cells
  for(let i=0; i<Bvals.length; i++) {
    for(let j=0; j<Tvals.length; j++) {
      const n = minCheckers(Bvals[i], Tvals[j]);
      const x = startX + j*cellW;
      const y = startY + i*cellH;
      tctx.fillStyle = '#0d1b2a';
      tctx.fillRect(x+1, y+1, cellW-2, cellH-2);
      tctx.strokeStyle = '#1a3a5c'; tctx.lineWidth = 1;
      tctx.strokeRect(x, y, cellW, cellH);
      tctx.fillStyle = '#fff'; tctx.font = 'bold 12px sans-serif'; tctx.textAlign = 'center';
      tctx.fillText(n, x + cellW/2, y + cellH/2 + 4);
    }
  }
}

// =============================================================================
// Events
// =============================================================================

document.getElementById('bSlider').oninput = function() {
  B = parseInt(this.value);
  document.getElementById('bVal').textContent = B;
  reset();
};
document.getElementById('tSlider').oninput = function() {
  T = parseInt(this.value);
  document.getElementById('tVal').textContent = T;
  reset();
};
document.getElementById('nSlider').oninput = function() {
  N = parseInt(this.value);
  document.getElementById('nVal').textContent = N;
  reset();
};
document.getElementById('btnReset').onclick = reset;
document.getElementById('btnStep').onclick = function() {
  stopAuto(); step();
};
document.getElementById('btnAuto').onclick = function() {
  if(autoTimer) stopAuto(); else startAuto();
};
document.getElementById('btnRandBad').onclick = function() {
  badChip = Math.floor(Math.random() * B);
  reset();
};

// Init
reset();
</script>
</body>
</html>
