<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLP 多元回归 — 手写 Autograd</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eaeaea;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; color: #e94560; }
  .subtitle { color: #a0a0b0; font-size: 0.85rem; margin-bottom: 16px; }

  .panel {
    background: #16213e;
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 960px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 14px;
  }
  @media (max-width: 720px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    height: 300px;
    background: #0f1628;
    border-radius: 10px;
    overflow: hidden;
  }
  .canvas-wrap.small { height: 200px; }
  canvas { display: block; width: 100%; height: 100%; }

  .ctrl-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 10px;
  }
  button {
    background: #0f3460;
    color: #eaeaea;
    border: none;
    border-radius: 6px;
    padding: 7px 16px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1a4a80; }
  button.primary { background: #e94560; }
  button.primary:hover { background: #ff6077; }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #b0b0c0;
    font-size: 0.8rem;
  }
  .slider-group label { min-width: 50px; }
  .slider-group span.val { color: #e94560; font-weight: bold; min-width: 36px; text-align: right; }
  input[type="range"] { accent-color: #e94560; width: 110px; }

  select {
    background: #0f3460;
    color: #eaeaea;
    border: 1px solid #0f3460;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }

  .stats-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-size: 0.85rem;
    color: #c0c0d0;
  }
  .stats-bar span.highlight { color: #e94560; font-weight: bold; }
  .stats-bar span.ok { color: #4ade80; }

  .section-title {
    color: #e94560;
    font-size: 0.95rem;
    margin-bottom: 6px;
  }

  .net-viz {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin: 10px 0;
    font-size: 0.75rem;
    color: #8899aa;
  }
  .layer-col { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .node {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #0f3460;
    border: 2px solid #1a4a80;
    transition: all 0.3s;
  }
  .node.active { background: #e94560; border-color: #ff6077; box-shadow: 0 0 8px rgba(233,69,96,0.5); }
  .node.input { background: #60a5fa; border-color: #93c5fd; }
  .node.output { background: #ffd700; border-color: #fde047; }
  .layer-label { margin-top: 4px; }
</style>
</head>
<body>

<h1>MLP 多元回归 — 手写 Autograd</h1>
<div class="subtitle">两层 Linear + ReLU · 纯 NumPy/JS 实现 · 反向传播可视化</div>

<div class="panel">
  <div class="section-title">网络结构</div>
  <div class="net-viz" id="netViz">
    <div class="layer-col"><div class="node input"></div><span>Input</span></div>
    <span>→</span>
    <div class="layer-col" id="hiddenLayer"><div class="node"></div><span>Linear₁</span></div>
    <span>→</span>
    <div class="layer-col"><div class="node"></div><span>ReLU</span></div>
    <span>→</span>
    <div class="layer-col"><div class="node output"></div><span>Linear₂ → Output</span></div>
  </div>
  <div class="ctrl-row">
    <button class="primary" onclick="toggleTrain()" id="btnTrain">开始训练 ▶</button>
    <button onclick="resetTrain()">重置</button>
    <button onclick="stepTrain()">单步</button>
    <div class="slider-group">
      <label>Hidden</label>
      <input type="range" id="hidRange" min="2" max="64" value="16" step="2">
      <span class="val" id="hidVal">16</span>
    </div>
    <div class="slider-group">
      <label>学习率</label>
      <input type="range" id="lrRange" min="1" max="100" value="20">
      <span class="val" id="lrVal">0.02</span>
    </div>
    <div class="slider-group">
      <label>目标</label>
      <select id="funcSelect">
        <option value="linear">线性 y=2x+3</option>
        <option value="quadratic" selected>二次 y=x²</option>
        <option value="sine">正弦 y=sin(x)</option>
        <option value="abs">绝对值 y=|x|</option>
      </select>
    </div>
  </div>
</div>

<div class="grid-2">
  <div class="panel">
    <div class="section-title">拟合过程</div>
    <div class="canvas-wrap" id="fitWrap">
      <canvas id="fitCanvas"></canvas>
    </div>
    <div class="stats-bar">
      <span>Epoch: <span class="highlight" id="epochDisp">0</span></span>
      <span>Loss: <span class="highlight" id="lossDisp">-</span></span>
      <span>R²: <span class="ok" id="r2Disp">-</span></span>
    </div>
  </div>
  <div class="panel">
    <div class="section-title">Loss 曲线</div>
    <div class="canvas-wrap small" id="lossWrap">
      <canvas id="lossCanvas"></canvas>
    </div>
    <div class="stats-bar" style="margin-top:6px;font-size:0.78rem;color:#a0a0b0;">
      红色: 训练 Loss | 绿色虚线: 目标 loss ≈ noise²/2
    </div>
  </div>
</div>

<div class="panel">
  <div class="section-title">反向传播可视化</div>
  <div class="canvas-wrap small" id="gradWrap">
    <canvas id="gradCanvas"></canvas>
  </div>
  <div class="stats-bar" style="margin-top:6px;font-size:0.78rem;color:#a0a0b0;">
    显示梯度在每一层的传播量级（对数尺度）
  </div>
</div>

<script>
// ==================== Matrix Utils ====================
function zeros(rows, cols) {
  return Array.from({length: rows}, () => Array(cols).fill(0));
}
function randUniform(rows, cols, lo, hi) {
  return Array.from({length: rows}, () => Array.from({length: cols}, () => lo + Math.random() * (hi - lo)));
}
function matMul(A, B) {
  const n = A.length, m = A[0].length, p = B[0].length;
  const C = zeros(n, p);
  for (let i = 0; i < n; i++)
    for (let k = 0; k < m; k++)
      for (let j = 0; j < p; j++)
        C[i][j] += A[i][k] * B[k][j];
  return C;
}
function matAdd(A, B) {
  return A.map((row, i) => row.map((v, j) => v + B[i][j]));
}
function matSub(A, B) {
  return A.map((row, i) => row.map((v, j) => v - B[i][j]));
}
function matScale(A, s) {
  return A.map(row => row.map(v => v * s));
}
function matTrans(A) {
  const n = A.length, m = A[0].length;
  const T = zeros(m, n);
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) T[j][i] = A[i][j];
  return T;
}
function matSumRows(A) {
  const m = A[0].length;
  return [Array.from({length: m}, (_, j) => A.reduce((s, row) => s + row[j], 0))];
}
function matMeanSq(A) {
  let s = 0, n = A.length, m = A[0].length;
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) s += A[i][j] * A[i][j];
  return s / (n * m);
}
function relu(M) {
  return M.map(row => row.map(v => Math.max(0, v)));
}

// ==================== MLP ====================
class Linear {
  constructor(d_in, d_out) {
    const limit = Math.sqrt(6 / (d_in + d_out));
    this.W = randUniform(d_in, d_out, -limit, limit);
    this.b = zeros(1, d_out);
    this.x = null;
    this.grad_W = zeros(d_in, d_out);
    this.grad_b = zeros(1, d_out);
  }
  forward(x) {
    this.x = x;
    return matAdd(matMul(x, this.W), this.b);
  }
  backward(grad_out) {
    const n = this.x.length;
    // grad_W = x^T @ grad_out
    this.grad_W = zeros(this.W.length, this.W[0].length);
    for (let i = 0; i < this.x.length; i++)
      for (let j = 0; j < this.W[0].length; j++)
        for (let k = 0; k < this.x[0].length; k++)
          this.grad_W[k][j] += this.x[i][k] * grad_out[i][j];
    // grad_b = sum(grad_out)
    this.grad_b = matSumRows(grad_out);
    // grad_in = grad_out @ W^T
    const grad_in = zeros(grad_out.length, this.W.length);
    for (let i = 0; i < grad_out.length; i++)
      for (let j = 0; j < this.W.length; j++)
        for (let k = 0; k < grad_out[0].length; k++)
          grad_in[i][j] += grad_out[i][k] * this.W[j][k];
    return grad_in;
  }
  update(lr) {
    for (let i = 0; i < this.W.length; i++)
      for (let j = 0; j < this.W[0].length; j++)
        this.W[i][j] -= lr * this.grad_W[i][j];
    for (let j = 0; j < this.b[0].length; j++)
      this.b[0][j] -= lr * this.grad_b[0][j];
  }
}

class ReLUMod {
  constructor() { this.mask = null; }
  forward(x) {
    this.mask = x.map(row => row.map(v => v > 0 ? 1 : 0));
    return relu(x);
  }
  backward(grad_out) {
    return grad_out.map((row, i) => row.map((v, j) => v * this.mask[i][j]));
  }
  update(lr) {}
}

class MLP {
  constructor(d_in, hidden, d_out) {
    this.layers = [new Linear(d_in, hidden), new ReLUMod(), new Linear(hidden, d_out)];
  }
  forward(x) {
    for (let L of this.layers) x = L.forward(x);
    return x;
  }
  trainStep(x, y, lr) {
    let out = x;
    for (let L of this.layers) out = L.forward(out);
    const diff = matSub(out, y);
    const loss = 0.5 * matMeanSq(diff);
    // backward
    let grad = matScale(diff, 1 / diff.length);
    for (let i = this.layers.length - 1; i >= 0; i--)
      grad = this.layers[i].backward(grad);
    // update
    for (let L of this.layers) L.update(lr);
    return loss;
  }
}

// ==================== Data Generation ====================
function generateData(func, N) {
  const xs = [], ys = [];
  for (let i = 0; i < N; i++) {
    const x = -2 + 4 * Math.random();
    let y;
    switch(func) {
      case 'linear': y = 2 * x + 3; break;
      case 'quadratic': y = x * x; break;
      case 'sine': y = Math.sin(x * Math.PI); break;
      case 'abs': y = Math.abs(x); break;
      default: y = x * x;
    }
    y += (Math.random() - 0.5) * 0.2; // noise
    xs.push([x]);
    ys.push([y]);
  }
  return {xs, ys, xMin: -2, xMax: 2};
}

// ==================== Canvas Setup ====================
const fitWrap = document.getElementById('fitWrap');
const fitCanvas = document.getElementById('fitCanvas');
const fitCtx = fitCanvas.getContext('2d');
let fitW = 0, fitH = 0;

const lossWrap = document.getElementById('lossWrap');
const lossCanvas = document.getElementById('lossCanvas');
const lossCtx = lossCanvas.getContext('2d');
let lossW = 0, lossH = 0;

const gradWrap = document.getElementById('gradWrap');
const gradCanvas = document.getElementById('gradCanvas');
const gradCtx = gradCanvas.getContext('2d');
let gradW = 0, gradH = 0;

function resizeAll() {
  const dpr = window.devicePixelRatio || 1;
  [ [fitWrap, fitCanvas, 'fit'], [lossWrap, lossCanvas, 'loss'], [gradWrap, gradCanvas, 'grad'] ].forEach(([wrap, canv, name]) => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canv.width = w * dpr; canv.height = h * dpr;
    canv.style.width = w + 'px'; canv.style.height = h + 'px';
    const ctx = canv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (name === 'fit') { fitW = w; fitH = h; }
    if (name === 'loss') { lossW = w; lossH = h; }
    if (name === 'grad') { gradW = w; gradH = h; }
  });
}

// ==================== Training State ====================
let model = null;
let data = null;
let lossHistory = [];
let gradHistory = [];
let epoch = 0;
let training = false;
let trainRaf = null;

function initModel() {
  const hidden = parseInt(document.getElementById('hidRange').value, 10);
  const func = document.getElementById('funcSelect').value;
  data = generateData(func, 200);
  model = new MLP(1, hidden, 1);
  lossHistory = [];
  gradHistory = [];
  epoch = 0;
  updateNetViz(hidden);
}

function updateNetViz(hidden) {
  const col = document.getElementById('hiddenLayer');
  col.innerHTML = '';
  const count = Math.min(hidden, 8);
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    d.className = 'node';
    col.appendChild(d);
  }
  const label = document.createElement('span');
  label.textContent = 'Linear₁ (' + hidden + ')';
  col.appendChild(label);
}

function getLR() {
  return parseInt(document.getElementById('lrRange').value, 10) / 1000;
}

function trainEpoch() {
  const lr = getLR();
  const l = model.trainStep(data.xs, data.ys, lr);
  lossHistory.push(l);
  if (lossHistory.length > 500) lossHistory.shift();

  // record gradient norm
  let gradNorm = 0;
  for (let L of model.layers) {
    if (L.grad_W) {
      for (let row of L.grad_W) for (let v of row) gradNorm += v*v;
    }
  }
  gradHistory.push(Math.sqrt(gradNorm));
  if (gradHistory.length > 500) gradHistory.shift();

  epoch++;
}

function computeR2() {
  const pred = model.forward(data.xs);
  const yMean = data.ys.reduce((s, r) => s + r[0], 0) / data.ys.length;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < pred.length; i++) {
    ssRes += (pred[i][0] - data.ys[i][0]) ** 2;
    ssTot += (data.ys[i][0] - yMean) ** 2;
  }
  return 1 - ssRes / ssTot;
}

// ==================== Drawing ====================
function drawFit() {
  fitCtx.fillStyle = '#0f1628';
  fitCtx.fillRect(0, 0, fitW, fitH);

  // compute bounds
  let yMin = Infinity, yMax = -Infinity;
  for (let r of data.ys) { yMin = Math.min(yMin, r[0]); yMax = Math.max(yMax, r[0]); }
  // add margin
  const yRange = yMax - yMin || 1;
  yMin -= yRange * 0.1; yMax += yRange * 0.1;
  const xMin = data.xMin, xMax = data.xMax;

  const mapX = x => 40 + (x - xMin) / (xMax - xMin) * (fitW - 80);
  const mapY = y => fitH - 30 - (y - yMin) / (yMax - yMin) * (fitH - 60);

  // draw true function curve (green dashed)
  fitCtx.strokeStyle = 'rgba(74,222,128,0.4)';
  fitCtx.setLineDash([4, 4]);
  fitCtx.lineWidth = 1.5;
  fitCtx.beginPath();
  const func = document.getElementById('funcSelect').value;
  for (let px = 0; px <= fitW; px += 2) {
    const x = xMin + (px - 40) / (fitW - 80) * (xMax - xMin);
    let y;
    switch(func) {
      case 'linear': y = 2*x + 3; break;
      case 'quadratic': y = x*x; break;
      case 'sine': y = Math.sin(x * Math.PI); break;
      case 'abs': y = Math.abs(x); break;
      default: y = x*x;
    }
    const py = mapY(y);
    if (px === 0) fitCtx.moveTo(px, py);
    else fitCtx.lineTo(px, py);
  }
  fitCtx.stroke();
  fitCtx.setLineDash([]);

  // draw prediction curve
  const predXs = [];
  for (let i = 0; i <= 100; i++) predXs.push([xMin + (xMax - xMin) * i / 100]);
  const predYs = model.forward(predXs);
  fitCtx.strokeStyle = '#e94560';
  fitCtx.lineWidth = 2;
  fitCtx.beginPath();
  for (let i = 0; i < predXs.length; i++) {
    const px = mapX(predXs[i][0]);
    const py = mapY(predYs[i][0]);
    if (i === 0) fitCtx.moveTo(px, py);
    else fitCtx.lineTo(px, py);
  }
  fitCtx.stroke();

  // draw data points
  for (let i = 0; i < data.xs.length; i++) {
    const px = mapX(data.xs[i][0]);
    const py = mapY(data.ys[i][0]);
    fitCtx.fillStyle = '#60a5fa';
    fitCtx.beginPath();
    fitCtx.arc(px, py, 2.5, 0, Math.PI*2);
    fitCtx.fill();
  }

  // legend
  fitCtx.fillStyle = '#60a5fa'; fitCtx.beginPath(); fitCtx.arc(fitW - 120, 14, 3, 0, Math.PI*2); fitCtx.fill();
  fitCtx.fillStyle = '#a0a0b0'; fitCtx.font = '11px sans-serif'; fitCtx.fillText('数据点', fitW - 110, 18);
  fitCtx.strokeStyle = '#e94560'; fitCtx.lineWidth = 2; fitCtx.beginPath(); fitCtx.moveTo(fitW - 120, 30); fitCtx.lineTo(fitW - 100, 30); fitCtx.stroke();
  fitCtx.fillText('MLP 预测', fitW - 95, 34);
  fitCtx.strokeStyle = 'rgba(74,222,128,0.6)'; fitCtx.setLineDash([3,3]); fitCtx.beginPath(); fitCtx.moveTo(fitW-120, 46); fitCtx.lineTo(fitW-100, 46); fitCtx.stroke(); fitCtx.setLineDash([]);
  fitCtx.fillText('真实函数', fitW - 95, 50);
}

function drawLoss() {
  lossCtx.fillStyle = '#0f1628';
  lossCtx.fillRect(0, 0, lossW, lossH);

  if (lossHistory.length < 2) return;

  const maxL = Math.max(...lossHistory, 0.5);
  const minL = Math.min(...lossHistory);

  // curve
  lossCtx.strokeStyle = '#e94560';
  lossCtx.lineWidth = 1.5;
  lossCtx.beginPath();
  for (let i = 0; i < lossHistory.length; i++) {
    const x = (i / (lossHistory.length - 1)) * lossW;
    const y = lossH - ((lossHistory[i] - minL) / (maxL - minL + 0.001)) * (lossH - 20) - 10;
    if (i === 0) lossCtx.moveTo(x, y);
    else lossCtx.lineTo(x, y);
  }
  lossCtx.stroke();

  lossCtx.fillStyle = '#a0a0b0';
  lossCtx.font = '10px sans-serif';
  lossCtx.fillText('loss', 4, 12);
  lossCtx.fillText(maxL.toFixed(3), 4, 24);
}

function drawGrad() {
  gradCtx.fillStyle = '#0f1628';
  gradCtx.fillRect(0, 0, gradW, gradH);

  if (gradHistory.length < 2) return;

  const maxG = Math.max(...gradHistory, 0.01);
  const minG = Math.min(...gradHistory);

  gradCtx.strokeStyle = '#ffd700';
  gradCtx.lineWidth = 1.5;
  gradCtx.beginPath();
  for (let i = 0; i < gradHistory.length; i++) {
    const x = (i / (gradHistory.length - 1)) * gradW;
    const y = gradH - ((Math.log10(Math.max(gradHistory[i], 1e-10)) - Math.log10(1e-5)) / (Math.log10(maxG) - Math.log10(1e-5) + 0.001)) * (gradH - 20) - 10;
    if (i === 0) gradCtx.moveTo(x, y);
    else gradCtx.lineTo(x, y);
  }
  gradCtx.stroke();

  gradCtx.fillStyle = '#a0a0b0';
  gradCtx.font = '10px sans-serif';
  gradCtx.fillText('梯度范数 (log)', 4, 12);
}

function updateStats() {
  document.getElementById('epochDisp').textContent = epoch;
  if (lossHistory.length > 0) {
    document.getElementById('lossDisp').textContent = lossHistory[lossHistory.length - 1].toFixed(5);
  }
  const r2 = computeR2();
  document.getElementById('r2Disp').textContent = r2.toFixed(4);
}

// ==================== Training Loop ====================
function trainLoop() {
  if (!training) return;
  for (let i = 0; i < 5; i++) trainEpoch();
  drawFit();
  drawLoss();
  drawGrad();
  updateStats();
  trainRaf = requestAnimationFrame(trainLoop);
}

function toggleTrain() {
  training = !training;
  document.getElementById('btnTrain').textContent = training ? '暂停 ⏸' : '开始训练 ▶';
  if (training) {
    if (!model) initModel();
    trainLoop();
  } else {
    if (trainRaf) cancelAnimationFrame(trainRaf);
  }
}

function stepTrain() {
  if (!model) initModel();
  if (training) toggleTrain();
  for (let i = 0; i < 10; i++) trainEpoch();
  drawFit(); drawLoss(); drawGrad(); updateStats();
}

function resetTrain() {
  training = false;
  document.getElementById('btnTrain').textContent = '开始训练 ▶';
  if (trainRaf) cancelAnimationFrame(trainRaf);
  initModel();
  drawFit(); drawLoss(); drawGrad(); updateStats();
}

// ==================== Event Listeners ====================
document.getElementById('hidRange').addEventListener('input', e => {
  document.getElementById('hidVal').textContent = e.target.value;
  resetTrain();
});
document.getElementById('lrRange').addEventListener('input', e => {
  document.getElementById('lrVal').textContent = (e.target.value / 1000).toFixed(3);
});
document.getElementById('funcSelect').addEventListener('change', resetTrain);
window.addEventListener('resize', () => { resizeAll(); drawFit(); drawLoss(); drawGrad(); });

// ==================== Init ====================
resizeAll();
initModel();
drawFit(); drawLoss(); drawGrad(); updateStats();
</script>
</body>
</html>
